<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>By Miho – Finger Food Catering</title><meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--pink:#f7b8c8;--pl:#fff0f4;--pd:#e0678b;--ink:#1a1a1a;--mut:#6b6b6b;--line:#f6d5de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Poppins,system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0}img{max-width:100%}
.script{font-family:"Dancing Script",cursive}
.hero{background:linear-gradient(#ffdbe5,#fff);text-align:center;padding:18px 16px 8px}
.hero img{width:170px;max-width:55%}.hero p{margin:4px 0 0;color:var(--mut)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;padding:8px 16px;border-radius:99px;background:var(--pl);color:var(--ink);font-weight:500}
.tabs button.on{background:var(--pd);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:16px;max-width:1000px;margin:auto}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 14px #f7b8c833;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;background:linear-gradient(135deg,#ffe3ec,#fff6f9);display:grid;place-items:center;font-size:64px}
.pic img{width:100%;height:100%;object-fit:cover}
.card .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:16px}.card p{margin:0;color:var(--mut);font-size:13px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.price{font-weight:600;color:var(--pd)}
.btn{background:var(--pd);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600}
.btn.ghost{background:var(--pl);color:var(--ink)}.btn.sm{padding:6px 12px;font-size:13px}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:8;max-width:560px;margin:auto;background:var(--ink);color:#fff;border-radius:99px;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.cartbar.hide{display:none}
.sheet{position:fixed;inset:0;background:#0006;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.pane{background:#fff;width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
.pane h2{margin:0 0 10px}
label{display:block;font-weight:500;margin:12px 0 4px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.opt{display:inline-block;margin:3px}.opt input{display:none}
.opt span{display:inline-block;padding:7px 14px;border-radius:99px;background:var(--pl);border:1px solid var(--line)}
.opt input:checked+span{background:var(--pd);color:#fff;border-color:var(--pd)}
.qty{display:flex;align-items:center;gap:14px}.qty button{width:36px;height:36px;border-radius:50%;background:var(--pl);font-size:20px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line small{color:var(--mut);display:block}
.foot{text-align:center;padding:30px 16px 110px;color:var(--mut);font-size:13px}
#qr,#qr2{display:inline-block;position:relative;padding:10px;background:#fff;border:2px dashed var(--pink);border-radius:16px;margin:8px;line-height:0}
.ql{position:absolute;left:50%;top:50%;width:27%;height:auto;transform:translate(-50%,-50%);background:#fff;padding:4px;border-radius:14px}
.ok{text-align:center;padding:20px 0}.ok .big{font-size:56px}
.wrap{max-width:900px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ord{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;border-left:6px solid var(--pink)}
.ord.Preparing{border-left-color:#f0b429}.ord.Ready{border-left-color:#3bb273}.ord.Done{opacity:.55}
.tag{padding:3px 10px;border-radius:99px;background:var(--pl);font-size:12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--pl);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font-size:22px;color:var(--pd)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:50;display:none}
@media print{.noprint{display:none!important}}
</style></head><body>
<div id="app"></div><div class="toast" id="toast"></div>

function menuHTML(){return `<div class="hero"><img src="${LOGO}" alt="By Miho"><p>Tap a treat, make it yours, and we'll prepare it with love 💕</p></div>
<div class="tabs">${cats().map(c=>`<button class="${c==cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}</div>
<div class="grid">${P.filter(p=>!p.off&&(cat=="All"||p.c==cat)).map(p=>`<div class="card"><div class="pic">${p.img?`<img src="${p.img}" alt="${esc(p.n)}">`:p.e}</div><div class="b"><h3>${esc(p.n)}</h3><p>${esc(p.d)}</p><div class="row"><span class="price">${p.p?money(p.p):"Custom quote"}</span><button class="btn sm" onclick="openItem(${p.id})">${p.custom?"Request":"Add"}</button></div></div></div>`).join("")}</div>
<div class="foot"><div class="script" style="font-size:26px;color:var(--pd)">Share our menu</div>Scan to open this page<br><div id="qr"></div><br>Follow us on Instagram @by_maha.shahine<br><a href="#admin" onclick="view='admin';setTimeout(render)" style="color:var(--mut)">Admin</a></div>
<div class="cartbar ${count()?"":"hide"}" onclick="openCart()"><span>🛍️ ${count()} item${count()>1?"s":""}</span><span>View order · ${money(total())}</span></div>
<div class="sheet" id="sheet" onclick="if(event.target==this)closeSheet()"><div class="pane" id="pane"></div></div>`}
const QRC="#ec86a5"; // baby pink QR (kept deep enough for phones to scan)
function makeQR(sel,url,sz){const el=$(sel);if(!el||!window.QRCode)return;el.innerHTML="";new QRCode(el,{text:url,width:sz,height:sz,colorDark:QRC,colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});const g=document.createElement("img");g.src=LOGO;g.className="ql";g.alt="";el.appendChild(g)}
function sheet(h){$("#pane").innerHTML=h;$("#sheet").classList.add("show")}
function closeSheet(){$("#sheet").classList.remove("show")}
let cur=null,cq=1;
function openItem(id){cur=P.find(p=>p.id==id);cq=1;sheet(`<h2 class="script" style="font-size:30px;color:var(--pd)">${esc(cur.n)}</h2><p style="color:var(--mut);margin:0">${esc(cur.d)}</p>
${cur.o.length?`<label>Choose your flavor</label>${cur.o.map((o,i)=>`<label class="opt"><input type="radio" name="opt" value="${esc(o)}" ${i?"":"checked"}><span>${esc(o)}</span></label>`).join("")}`:""}
${cur.custom?"":`<label>Quantity (boxes)</label><div class="qty"><button onclick="cq=Math.max(1,cq-1);$('#cq').textContent=cq">−</button><b id="cq">1</b><button onclick="cq++;$('#cq').textContent=cq">+</button></div>`}
<label>${cur.custom?"Describe your order":"Special requests (optional)"}</label><textarea id="note" rows="3" placeholder="${cur.custom?"Items, quantity, event type…":"Less spicy, extra pink wrapping, allergies…"}"></textarea>
<div class="row" style="margin-top:18px"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" onclick="addItem()">Add to order</button></div>`)}
function addItem(){const o=document.querySelector("input[name=opt]:checked"),n=$("#note").value.trim();if(cur.custom&&!n)return toast("Please describe your order");
cart.push({pid:cur.id,n:cur.n,p:cur.p,q:cur.custom?1:cq,o:o?o.value:"",note:n});closeSheet();render();toast("Added 💕")}
function openCart(){if(!cart.length)return;sheet(`<h2>Your order</h2>${cart.map((i,k)=>`<div class="line"><div><b>${i.q}× ${esc(i.n)}</b><small>${esc(i.o)}${i.note?" · "+esc(i.note):""}</small></div><div>${i.p?money(i.p*i.q):"Quote"}<br><a href="#" onclick="cart.splice(${k},1);render();openCart();return false" style="color:var(--pd);font-size:12px">Remove</a></div></div>`).join("")}
<div class="line"><b>Total</b><b>${money(total())}</b></div>
<label>Your name</label><input id="cn" autocomplete="name"><label>Phone / WhatsApp</label><input id="cp" type="tel" autocomplete="tel">
<label>Pickup / delivery date & time</label><input id="cd" type="datetime-local"><label>Delivery address (leave empty for pickup)</label><input id="ca">
<div class="row" style="margin-top:18px"><button class="btn ghost" onclick="closeSheet()">Back</button><button class="btn" onclick="place()">Place order</button></div>`)}
async function place(){const n=$("#cn").value.trim(),p=$("#cp").value.trim(),d=$("#cd").value;if(!n||!p||!d)return toast("Please fill name, phone and date");
const o={id:Date.now(),code:"M"+String(Date.now()).slice(-5),name:n,phone:p,when:d,addr:$("#ca").value.trim(),items:cart,total:total(),status:"New",ts:new Date().toISOString()};
try{await Store.add(o)}catch(e){return toast("Could not send the order, please try again")}cart=[];render();sheet(`<div class="ok"><div class="big">🎀</div><h2 class="script" style="font-size:32px;color:var(--pd)">Thank you, ${esc(n)}!</h2><p>Your order <b>#${o.code}</b> was received. We will contact you on ${esc(p)} to confirm.</p><button class="btn" onclick="closeSheet()">Back to menu</button></div>`)}
// ---- admin
function adminHTML(){if(!authed)return `<div class="wrap" style="max-width:360px;text-align:center;padding-top:60px"><img src="${LOGO}" width="140"><h2>Admin sign-in</h2>${LIVE?'<input id="em" type="email" placeholder="Admin email" autocomplete="username" style="text-align:center"><br><br>':""}<input id="pin" type="password" placeholder="${LIVE?"Password":"PIN"}" ${LIVE?"":'inputmode="numeric"'} autocomplete="current-password" style="text-align:center"><br><br><button class="btn" onclick="login()">Enter</button><br><br><a href="#" onclick="view='menu';location.hash='';render();return false" style="color:var(--mut)">← Back to menu</a></div>`;
if(tab=="products")return prodHTML();
const a=ORD,c=s=>a.filter(o=>o.status==s).length,L=a.filter(o=>flt=="All"||o.status==flt);
return `<div class="wrap"><div class="top"><h2 class="script" style="font-size:32px;color:var(--pd);margin:0">Orders dashboard</h2><span class="noprint"><button class="btn ghost sm" onclick="window.print()">🖨 Print QR card</button> <button class="btn sm" onclick="tab='products';render()">✏️ Products</button> <button class="btn sm" onclick="view='menu';location.hash='';render()">View menu</button> <button class="btn ghost sm" onclick="logout(1)">Sign out</button></span></div>
<div class="stats">${["New","Preparing","Ready","Done"].map(s=>`<div><b>${c(s)}</b>${s}</div>`).join("")}</div>
<div class="tabs noprint" style="position:static;padding:0 0 8px">${["All","New","Preparing","Ready","Done"].map(s=>`<button class="${s==flt?"on":""}" onclick="flt='${s}';render()">${s}</button>`).join("")}</div>
${L.length?L.map(o=>`<div class="ord ${o.status}"><div class="top"><b>#${o.code} · ${esc(o.name)}</b><span class="tag">${o.status}</span></div>
<small>📞 ${esc(o.phone)} · 🗓 ${esc(o.when.replace("T"," "))}${o.addr?" · 📍 "+esc(o.addr):" · Pickup"}</small>
${o.items.map(i=>`<div class="line"><div>${i.q}× <b>${esc(i.n)}</b> ${i.o?"("+esc(i.o)+")":""}${i.note?`<small>📝 ${esc(i.note)}</small>`:""}</div></div>`).join("")}
<div class="top" style="margin-top:8px"><b>${money(o.total)}</b><span class="noprint">${o.status=="New"?`<button class="btn sm" onclick="setS(${o.id},'Preparing')">Start preparing</button>`:o.status=="Preparing"?`<button class="btn sm" onclick="setS(${o.id},'Ready')">Mark ready</button>`:o.status=="Ready"?`<button class="btn sm" onclick="setS(${o.id},'Done')">Delivered</button>`:""}</span></div></div>`).join(""):`<p style="text-align:center;color:var(--mut);padding:40px">No orders yet.</p>`}
<div style="text-align:center;margin-top:24px"><div class="script" style="font-size:24px">Scan to order</div><div id="qr2"></div></div></div>`}
function prodHTML(){return `<div class="wrap"><div class="top"><h2 class="script" style="font-size:32px;color:var(--pd);margin:0">Products and prices</h2><span><button class="btn ghost sm" onclick="tab='orders';render()">← Orders</button> <button class="btn sm" onclick="editP(0)">+ Add product</button></span></div>
${P.map(p=>`<div class="ord" style="display:flex;gap:12px;align-items:center"><div class="pic" style="width:70px;height:70px;aspect-ratio:auto;font-size:34px;border-radius:12px;overflow:hidden;flex:none">${p.img?`<img src="${p.img}" alt="">`:p.e||"🍽"}</div><div style="flex:1;min-width:0"><b>${esc(p.n)}</b> ${p.off?'<span class="tag">Hidden</span>':""}<br><small>${esc(p.c)}</small></div>${p.custom?'<small>Quote</small>':`<input type="number" min="0" value="${p.p}" style="width:84px" onchange="qp(${p.id},this.value)" aria-label="Price">`}<button class="btn ghost sm" onclick="editP(${p.id})">Edit</button></div>`).join("")}
<div class="sheet" id="sheet" onclick="if(event.target==this)closeSheet()"><div class="pane" id="pane"></div></div></div>`}
function editP(id){pe=id?{...P.find(p=>p.id==id)}:{id:Date.now(),n:"",c:"Savory",p:0,e:"🍽",d:"",o:[]};
sheet(`<h2>${id?"Edit":"New"} product</h2><div class="pic" id="pv" style="border-radius:14px;overflow:hidden;margin-bottom:8px">${pe.img?`<img src="${pe.img}" alt="">`:pe.e}</div>
<input type="file" accept="image/*" onchange="upImg(this)"> <a href="#" onclick="pe.img='';$('#pv').textContent=pe.e;return false" style="color:var(--pd);font-size:13px">Remove photo</a>
<label>Name</label><input id="en" value="${esc(pe.n)}">
<label>Category</label><input id="ec" list="cl" value="${esc(pe.c)}"><datalist id="cl">${[...new Set(P.map(p=>p.c))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
<label>Price (${CUR})</label><input id="ep" type="number" min="0" value="${pe.p}">
<label>Description</label><textarea id="ed" rows="3">${esc(pe.d)}</textarea>
<label>Flavor options (comma separated)</label><input id="eo" value="${esc(pe.o.join(", "))}">
<label>Emoji (shown when there is no photo)</label><input id="ee" value="${esc(pe.e||"")}" maxlength="4">
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ek" style="width:auto" ${pe.custom?"checked":""}> Custom quote item (no fixed price)</label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ex" style="width:auto" ${pe.off?"checked":""}> Hide from menu</label>
<div class="row" style="margin-top:18px">${id?`<button class="btn ghost" onclick="delP(${id})">Delete</button>`:`<button class="btn ghost" onclick="closeSheet()">Cancel</button>`}<button class="btn" onclick="saveP(${id})">Save</button></div>`)}
function upImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pe.img=c.toDataURL("image/jpeg",.75);$("#pv").innerHTML=`<img src="${pe.img}" alt="">`};im.src=r.result};r.readAsDataURL(f)}
async function saveP(id){const n=$("#en").value.trim();if(!n)return toast("Name is required");
Object.assign(pe,{n,c:$("#ec").value.replace(/['"\\]/g,"").trim()||"Other",p:+$("#ep").value||0,d:$("#ed").value.trim(),o:$("#eo").value.split(",").map(s=>s.trim()).filter(Boolean),e:$("#ee").value||"🍽",custom:$("#ek").checked,off:$("#ex").checked});
if(pe.custom)pe.p=0;const a=id?P.map(p=>p.id==id?pe:p):[...P,pe];try{await Store.save(a,pe)}catch(e){return toast("Could not save, check connection")}P=a;closeSheet();render();toast("Saved ✓")}
async function delP(id){if(!confirm("Delete this product?"))return;const a=P.filter(p=>p.id!=id);try{await Store.del(a,id)}catch(e){return toast("Could not delete")}P=a;closeSheet();render()}
async function qp(id,v){const p0={...P.find(p=>p.id==id),p:Math.max(0,+v||0)},a=P.map(p=>p.id==id?p0:p);try{await Store.save(a,p0)}catch(e){return toast("Could not save price")}P=a;toast("Price updated ✓")}
async function login(){const pw=$("#pin").value;
if(!LIVE){if(pw==PIN){authed=true;await loadOrders();render()}else toast("Wrong PIN");return}
try{const r=await sb("/auth/v1/token?grant_type=password",{method:"POST",body:{email:$("#em").value.trim(),password:pw}});tok=r.access_token;sessionStorage.setItem("miho_tok",tok)}catch(e){return toast("Wrong email or password")}
authed=true;try{if(!(await Store.products()))await Store.seed(P)}catch(e){}await loadP();await loadOrders();render()}
async function setS(id,s){try{await Store.setStatus(id,s)}catch(e){return toast("Update failed")}await loadOrders()}
addEventListener("storage",()=>{if(!LIVE&&view=="admin"&&authed)loadOrders()});
addEventListener("hashchange",()=>{view=location.hash=="#admin"?"admin":"menu";render()});
if(LIVE&&tok&&view=="admin"){authed=true;loadOrders()}
render();loadP().then(()=>{if(view=="menu"&&!$("#sheet.show"))render()});
setInterval(()=>{if(view=="admin"&&authed&&tab=="orders")loadOrders()},8000);
</script></body></html>
